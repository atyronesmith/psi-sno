---
- name: Build the PSI Project ISO using include_role and tasks_from
  # This play will target the local machine, which is common for tasks
  # like building an ISO file. Change if your role needs to run elsewhere.
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../inventory/group_vars/all.yml

  tasks:
    - name: Dynamically include the 'make_iso' tasks from the 'openshift/cluster-deployer' role
      ansible.builtin.include_role:
        name: openshift/cluster-deployer
        tasks_from: deploy_cluster
