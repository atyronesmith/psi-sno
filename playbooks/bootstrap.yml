---
- name: Wait for OpenShift Bootstrap Completion
  hosts: localhost          # This playbook runs tasks on the Ansible control node
  gather_facts: false       # No need to gather facts from localhost for this task
  connection: local         # Ensures modules run locally
  vars_files:
    - ../inventory/group_vars/all.yml  # Load variables from the group_vars file
  vars:
    wait_timeout_minutes: 10
    max_retry_attempts: 3
    retry_delay_seconds: 30
    # Define the directory where your OpenShift installation configuration files
    # (e.g., install-config.yaml, auth/, etc.) are located.

  pre_tasks:
    - name: Validate required variables are defined
      ansible.builtin.assert:
        that:
          - wait_timeout_minutes is defined
          - wait_timeout_minutes | int > 0
        fail_msg: "Required variables are missing or invalid. Please check your configuration."
        success_msg: "All required variables are properly defined."

    - name: Display bootstrap configuration
      ansible.builtin.debug:
        msg:
          - "Bootstrap timeout: {{ wait_timeout_minutes }} minutes"
          - "Maximum retry attempts: {{ max_retry_attempts }}"

  tasks:
    - name: Read project metadata using iso-builder role
      ansible.builtin.include_role:
        name: openshift/iso-builder
        tasks_from: read_metadata

    - name: Wait for OpenShift bootstrap completion with retry logic
      block:
        - name: Run bootstrap completion check using cluster-deployer role
          ansible.builtin.include_role:
            name: openshift/cluster-deployer
            tasks_from: bootstrap
      rescue:
        - name: Display bootstrap failure information
          ansible.builtin.debug:
            msg:
              - "Bootstrap check failed. This could be due to:"
              - "1. Network connectivity issues"
              - "2. OpenShift installation still in progress"
              - "3. Configuration errors"
              - "Check the OpenShift installation logs for more details."

        - name: Fail with helpful error message
          ansible.builtin.fail:
            msg: |
              Bootstrap completion check failed after {{ max_retry_attempts }} attempts.
              Please verify:
              1. OpenShift cluster is properly installed
              2. Network connectivity to the cluster
              3. Authentication credentials are correct
              4. Check logs in {{ project_build_dir | default('/tmp') }}
      always:
        - name: Cleanup temporary files
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/.kube/config.tmp"
            state: absent
          failed_when: false
