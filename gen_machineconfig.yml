---
- name: Generate Ignition Configs from Butane Templates
  hosts: localhost  # This playbook runs tasks on the Ansible control node
  gather_facts: false
  connection: local
  vars_files:
    - common_vars.yml  # Load variables from an external file (if needed)

  tasks:
    - name: "Ensure the output directory exists '{{ ignition_output_dir }}'" # noqa run-once[task]
      ansible.builtin.file:
        path: "{{ ignition_output_dir }}"
        state: directory
        mode: '0755'
      run_once: true

    - name: "Find all Butane template files (.j2) in '{{ butane_templates_dir }}'" # noqa run-once[task]
      ansible.builtin.find:
        paths: "{{ butane_templates_dir }}"
        patterns: "*.j2" # Finds files like *.bu.j2, *.fcos.j2, etc.
        # Use patterns: "*.bu.j2" if you only want to match .bu.j2 files
      register: butane_template_files
      run_once: true

    - name: "Debug: Show found template files" # noqa run-once[task]
      ansible.builtin.debug:
        var: butane_template_files.files
      when: ansible_verbosity > 0 # Show only in verbose mode
      run_once: true

    - name: "Process each Butane template"
      when: butane_template_files.files | length > 0 # Only run if templates were found
      block:
        - name: "Loop through found Butane templates" # noqa run-once[task]
          ansible.builtin.include_tasks: tasks/process_butane_template.yaml # Using include_tasks for better organization
          loop: "{{ butane_template_files.files }}"
          loop_control:
            loop_var: current_butane_template_file_info
            # label: "{{ current_butane_template_file_info.path | basename }}" # Optional: better loop output
      rescue:
        - name: "Handle errors during template processing"
          ansible.builtin.debug:
            msg: "An error occurred. Please check logs. Ensure '{{ butane_executable }}' is installed and accessible."
          failed_when: true # Ensure the play fails if there's an error in the block

    - name: "No Butane templates found to process" # noqa run-once[task]
      ansible.builtin.debug:
        msg: "No *.j2 template files found in '{{ butane_templates_dir }}'. Nothing to do."
      when: butane_template_files.files | length == 0
      run_once: true

    - name: "Summary: Ignition file generation process complete" # noqa run-once[task]
      ansible.builtin.debug:
        msg: "Ignition file generation process finished. Check the '{{ ignition_output_dir }}' directory."
      run_once: true
