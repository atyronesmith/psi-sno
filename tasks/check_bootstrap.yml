---
# tasks/check_bootstrap.yml
# Tasks to check for the existence of the installation directory
# and wait for OpenShift bootstrap completion.
# These tasks expect 'project_dir' and 'wait_timeout_minutes' variables
# to be defined in the calling playbook.
- name: "Check status of '{{ project_dir }}'"
  ansible.builtin.stat:
    path: "{{ project_dir }}"
  register: dir_status

- name: "Fail if installation directory does not exist '{{ project_dir }}'"
  ansible.builtin.fail:
    msg: "Required installation directory '{{ project_dir }}' does not exist or is not a directory."
  when: not dir_status.stat.exists or not dir_status.stat.isdir

- name: "Wait for the OpenShift bootstrap to complete successfully {{ project_dir }}"
  ansible.builtin.command: "openshift-install wait-for bootstrap-complete --log-level=debug"
  args:
    # The 'chdir' argument changes the current working directory before executing the command.
    # This is crucial if 'openshift-install' needs to find configuration files relative to this path.
    chdir: "{{ project_dir }}"
  register: bootstrap_status
  # The 'timeout' parameter specifies the maximum time in seconds Ansible will wait for the command to complete.
  # If the command exceeds this time, the task will fail.
  timeout: "{{ wait_timeout_minutes * 60 }}" # Converts minutes to seconds
  # 'changed_when' determines if this task reports a "changed" state.
  # We consider it "changed" if the bootstrap process reports completion in stdout,
  # or more simply, if the command returns successfully (rc=0).
  # The command itself indicates completion via its exit code.
  changed_when: bootstrap_status.rc == 0 # True if command succeeded
  # By default, if the command returns a non-zero exit code or if the 'timeout' is reached,
  # this task will fail, and the playbook will stop. This is the desired behavior.

- name: "Bootstrap successfully completed"
  ansible.builtin.debug:
    msg: |
      OpenShift bootstrap successfully completed within the {{ wait_timeout_minutes }} minute time limit.
      Return Code: {{ bootstrap_status.rc }}
      STDOUT:
      {{ bootstrap_status.stdout | default('(No STDOUT)') }}
      STDERR:
      {{ bootstrap_status.stderr | default('(No STDERR)') }}
  # This task will only execute if the previous 'command' task succeeded.

- name: Ensure server {{ project_name }} exists # noqa name[template]
  openstack.cloud.server:
    name: "{{ project_name }}"
    auto_ip: false
    state: present
    image: "{{ project_iso_image }}" # The image to install/boot on the volume
    flavor: "{{ sno_flavor }}"
    volumes:
      - "{{ project_name }}" # Name of the volume to attach
    nics:
      - port-id: "{{ sno_port_result.ports[0].id }}" # Attach the pre-created port
      - port-id: "{{ os_port_result.ports[0].id }}" # Attach the pre-created OS port
    # security_groups: # Explicitly associate security group with server
    #   - "{{ project_name }}"
    #   - "{{ project_name }}-os"
    # key_name: "your-ssh-key-name" # Optional: if you want to inject an SSH key
    # user_data: "{{ lookup('file', 'cloud-init-config.yaml') }}" # Optional: for cloud-init
    wait: true # Wait for the server to become active
    timeout: 600 # Timeout for waiting (adjust as needed)
  register: server_result
