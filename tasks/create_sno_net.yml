---
- name: Output calculated instance IP for verification
  ansible.builtin.debug:
    msg: "Calculated instance IP: {{ project_instance_ip }}"

# Corresponds to the security_groups() function logic
- name: Ensure security group exists {{ project_name }}
  openstack.cloud.security_group:
    state: present
    name: "{{ project_name }}"
    description: "Security group for {{ project_name }}"
    security_group_rules:
      - protocol: icmp
        remote_ip_prefix: "0.0.0.0/0"  # Allow from anywhere
        description: "Allow ICMP"
        direction: ingress
      - protocol: tcp
        port_range_min: 22
        port_range_max: 22
        remote_ip_prefix: "0.0.0.0/0"
        description: "SSH access"
        direction: ingress
      - protocol: tcp
        port_range_min: 80
        port_range_max: 80
        remote_ip_prefix: "0.0.0.0/0"
        description: "HTTP access"
        direction: ingress
      - protocol: tcp
        port_range_min: 443
        port_range_max: 443
        remote_ip_prefix: "0.0.0.0/0"
        description: "HTTPS access"
        direction: ingress
      - protocol: tcp
        port_range_min: 6443
        port_range_max: 6443
        remote_ip_prefix: "0.0.0.0/0"
        description: "Kubernetes API access"
        direction: ingress
      - protocol: tcp
        port_range_min: 22623
        port_range_max: 22623
        remote_ip_prefix: "0.0.0.0/0"
        description: "Machine Config Server access"
        direction: ingress
  register: sec_group_result

- name: Ensure network {{ project_name }} exists # noqa name[template]
  openstack.cloud.network:
    state: present
    name: "{{ project_name }}"
  register: network_result

- name: Ensure subnet {{ project_name }} exists on network {{ project_name }} # noqa name[template]
  openstack.cloud.subnet:
    state: present
    network_name: "{{ project_name }}"
    name: "{{ project_name }}"
    cidr: "{{ project_cidr }}"
    dns_nameservers:
      - "{{ dns_fip }}"
  register: subnet_result

- name: "Ensure router is attached to subnet"
  openstack.cloud.router:
    state: present
    name: "{{ project_name }}"
    network: "{{ project_provider_network }}" # Sets the external gateway
    interfaces:
      - net: "{{ project_name }}"
        subnet: "{{ project_name }}"
  register: router_interface_info
  when: subnet_result.subnet is defined # Ensure parent resources exist

- name: Ensure port {{ project_name }} exists with fixed IP {{ project_instance_ip }} # noqa name[template]
  openstack.cloud.port:
    state: present
    name: "{{ project_name }}"
    network: "{{ project_name }}" # Name of the network
    security_groups:
      - "{{ project_name }}"
      - default
    fixed_ips:
      - subnet: "{{ project_name }}" # Name of the subnet
        ip_address: "{{ project_instance_ip }}"
  register: port_result
