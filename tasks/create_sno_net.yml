  # This task will run if the security group exists (either just created or already there).
  # The module itself is idempotent and will only add rules if they don't exist.
# Corresponds to the create_networks() function logic
- name: Ensure router {{ project_name }} exists and is connected to external network {{ psi_provider_network }} # noqa name[template]
  openstack.cloud.router:
    state: present
    name: "{{ project_name }}"
    network: "{{ psi_provider_network }}" # Sets the external gateway
    # Interfaces (subnets) are added in a separate task for clarity
  register: router_result

- name: Ensure network {{ project_name }} exists # noqa name[template]
  openstack.cloud.network:
    state: present
    name: "{{ project_name }}"
  register: network_result

- name: Ensure subnet {{ project_name }} exists on network {{ project_name }} # noqa name[template]
  openstack.cloud.subnet:
    state: present
    network_name: "{{ project_name }}"
    name: "{{ project_name }}"
    cidr: "{{ project_cidr }}"
    dns_nameservers:
      - "{{ project_dns_server }}"
  register: subnet_result

- name: "Ensure router is attached to subnet"
  openstack.cloud.router:
    state: present
    name: "{{ project_name }}"
    interfaces:
      - net: "{{ project_name }}"
        subnet: "{{ project_name }}"
  register: router_interface_info
  when: subnet_result.subnet is defined and router_result.router is defined # Ensure parent resources exist

- name: Ensure port {{ project_name }} exists with fixed IP {{ project_instance_ip }} # noqa name[template]
  openstack.cloud.port:
    state: present
    name: "{{ project_name }}"
    network: "{{ project_name }}" # Name of the network
    fixed_ips:
      - subnet: "{{ project_name }}" # Name of the subnet
        ip_address: "{{ project_instance_ip }}"
    security_groups:
      - "{{ project_name }}" # Attach the security group to the port
  register: port_result
