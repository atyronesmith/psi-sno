---
# This playbook is designed to delete OpenStack resources that were
# presumably created by a corresponding creation playbook.
# Ensure variables match those used during creation for accurate targeting.
# WARNING: This playbook PERMANENTLY DELETES resources. Use with extreme caution.
# It is recommended to run this in a test environment first and
# double-check the target resources before executing in production.

- name: "Gather info about the port '{{ project_name }}-os'" # noqa name[template]
  openstack.cloud.port_info:
    port: "{{ project_name }}-os"
    # network: "{{ project_name }}-os" # Optional: if port name isn't unique
  register: port_info_check
  ignore_errors: true # Continue if port is already gone

- name: "Delete port '{{ project_name }}-os'" # noqa name[template]
  openstack.cloud.port:
    state: absent
    name: "{{ project_name }}-os"
    # network: "{{ project_name }}-os" # Optional
    # fixed_ips: # Optional: for more precise targeting if name is not unique
    #   - subnet: "{{ project_name }}-os"
    #     ip_address: "{{ project_instance_ip_os }}"
  when: port_info_check.openstack_ports | default([]) | length > 0 # Only if port exists
  register: port_delete_result

- name: "Gather info about the router '{{ project_name }}-os'" # noqa name[template]
  openstack.cloud.routers_info:
    name: "{{ project_name }}-os"
  register: router_info_check
  ignore_errors: true

- name: "Delete router '{{ project_name }}-os'" # noqa name[template]
  openstack.cloud.router:
    state: absent
    name: "{{ project_name }}-os"
  when: router_info_check.openstack_routers | default([]) | length > 0 # Only if router exists
  register: router_delete_result

- name: "Gather info about the subnet '{{ project_name }}-os'" # noqa name[template]
  openstack.cloud.subnets_info:
    name: "{{ project_name }}-os"
    # network_name: "{{ project_name }}-os" # Optional
  register: subnet_info_check
  ignore_errors: true

- name: "Delete subnet '{{ project_name }}-os'" # noqa name[template]
  openstack.cloud.subnet:
    state: absent
    name: "{{ project_name }}-os"
    # network_name: "{{ project_name }}-os" # Optional
    # cidr: "{{ project_openstack_cidr }}" # Optional for precise targeting
  when: subnet_info_check.openstack_subnets | default([]) | length > 0 # Only if subnet exists
  register: subnet_delete_result

- name: "Gather info about the network '{{ project_name }}-os'" # noqa name[template]
  openstack.cloud.networks_info:
    name: "{{ project_name }}-os"
  register: network_info_check
  ignore_errors: true

- name: "Delete network '{{ project_name }}-os'" # noqa name[template]
  openstack.cloud.network:
    state: absent
    name: "{{ project_name }}-os"
  when: network_info_check.openstack_networks | default([]) | length > 0 # Only if network exists
  register: network_delete_result

- name: "Gather info about the security group '{{ project_name }}'" # noqa name[template]
  openstack.cloud.security_group_info:
    name: "{{ project_name }}"
  register: sg_info_check
  ignore_errors: true

- name: "Delete security group '{{ project_name }}'" # noqa name[template]
  openstack.cloud.security_group:
    state: absent
    name: "{{ project_name }}"
  when: sg_info_check.openstack_security_groups | default([]) | length > 0 # Only if security group exists
  # Deleting a security group also deletes all its rules.
  register: sg_delete_result

- name: "Deletion summary"
  ansible.builtin.debug:
    msg:
      - >-
        Port '{{ project_name }}-os' deletion status:
        {{ 'Already absent/Not found' if (port_info_check.openstack_ports | default([]) | length == 0)
           else ('Succeeded' if port_delete_result.changed else 'No change by module (already absent)') }}
      - >-
        Router interface detach for '{{ project_name }}-os' status:
        {{ 'Router not found or no interface to detach' if (router_info_check.openstack_routers | default([]) | length == 0)
           else ('Succeeded' if router_interface_delete_result.changed else 'No change by module (already detached or no interface)') }}
      - >-
        Router '{{ project_name }}-os' deletion status:
        {{ 'Already absent/Not found' if (router_info_check.openstack_routers | default([]) | length == 0)
           else ('Succeeded' if router_delete_result.changed else 'No change by module (already absent)') }}
      - >-
        Subnet '{{ project_name }}-os' deletion status:
        {{ 'Already absent/Not found' if (subnet_info_check.openstack_subnets | default([]) | length == 0)
           else ('Succeeded' if subnet_delete_result.changed else 'No change by module (already absent)') }}
      - >-
        Network '{{ project_name }}-os' deletion status:
        {{ 'Already absent/Not found' if (network_info_check.openstack_networks | default([]) | length == 0)
           else ('Succeeded' if network_delete_result.changed else 'No change by module (already absent)') }}
      - >-
        Security group '{{ project_name }}' deletion status:
        {{ 'Already absent/Not found' if (sg_info_check.openstack_security_groups | default([]) | length == 0)
               else ('Succeeded' if sg_delete_result.changed else 'No change by module (already absent)') }}
