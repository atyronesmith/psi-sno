---
- name: Ensure sno_iso_base is defined
  ansible.builtin.fail:
    msg: "The 'sno_iso_base' variable is not defined."
  when: sno_iso_base is not defined or sno_iso_base == ""

- name: Prompt for install_config_name if not defined, by listing files in 'install-configs/'
  when:
    - install_config is not defined # This entire block runs only if project_name is not initially set
  delegate_to: localhost # Ensures the when condition for the block is evaluated on localhost
  block:
    - name: Ensure the target directory exists
      ansible.builtin.stat:
        path: "{{ config_directory }}"
      register: dir_stat
      failed_when: not dir_stat.stat.exists or not dir_stat.stat.isdir
      changed_when: false # This task doesn't change anything

    - name: Find files in the specified directory
      ansible.builtin.find:
        paths: "{{ config_directory }}"
        file_type: file # We only want files, not directories
        # Use recurse: yes if you want to search in subdirectories
      register: found_files_result

    - name: Check if any files were found
      ansible.builtin.assert:
        that:
          - found_files_result.files | length > 0
        fail_msg: "No files found in the directory '{{ config_directory }}'."
        quiet: true

    - name: Prepare prompt message with file choices
      ansible.builtin.set_fact:
        file_choices_prompt: |
          Please choose a file from the list below (enter the number):
          {% for file_item in found_files_result.files %}
          {{ loop.index }}. {{ file_item.path | ansible.builtin.basename }}
          {% endfor %}
          Your choice:
        # Create a list of just the basenames for easier selection later
        file_basenames: "{{ found_files_result.files | map(attribute='path') | map('ansible.builtin.basename') | list }}"

    - name: Display choices and prompt user for selection
      ansible.builtin.pause:
        prompt: "{{ file_choices_prompt }}"
      register: user_choice_input

    - name: Validate user input is a number within range
      ansible.builtin.set_fact:
        user_selected_index: "{{ user_choice_input.user_input | int - 1 }}" # Convert to 0-based index
      failed_when: >
        (user_choice_input.user_input | int < 1) or
        (user_choice_input.user_input | int > file_basenames | length) or
        (user_choice_input.user_input != (user_choice_input.user_input | int | string))
      # The last condition checks if the input was indeed a whole number string
      # More robust validation might be needed for non-numeric input if not handled by int filter.

    - name: Determine the selected file
      ansible.builtin.set_fact:
        install_config: "{{ config_directory }}/{{ file_basenames[user_selected_index | int] }}"
      when: user_selected_index is defined

- name: "Check if the source install config file exists {{ install_config }}"
  ansible.builtin.stat:
    path: "{{ install_config }}"
  register: install_config_vars_file_stat
  delegate_to: localhost

- name: Load variables from the source install config file if it exists
  ansible.builtin.include_vars:
    file: "{{ install_config }}"
    name: "install_config_content" # Variables will be under install_config_content.X
  when: install_config_vars_file_stat.stat.exists
  delegate_to: localhost

- name: Create a temporary directory for OpenShift installation assets
  ansible.builtin.tempfile:
    state: directory
    prefix: "ocp_install_assets_"
  register: temp_install_config_dir_info # This var holds path to the temp directory
  delegate_to: localhost

- name: Copy source install config ({{ install_config }}) to temporary directory as 'install-config.yaml' # noqa name[template]
  ansible.builtin.copy:
    src: "{{ install_config }}" # Source is the user-specified or default install_config
    dest: "{{ temp_install_config_dir_info.path }}/install-config.yaml" # Must be 'install-config.yaml' for openshift-install
    mode: '0644'
    remote_src: true # Assuming install_config is on the controller
  when: temp_install_config_dir_info.path is defined and install_config_vars_file_stat.stat.exists
  delegate_to: localhost

- name: Create single-node ignition config
  ansible.builtin.command:
    # openshift-install uses the --dir argument for all its operations
    cmd: "openshift-install --dir={{ temp_install_config_dir_info.path }} create single-node-ignition-config"
    # creates condition points to the ignition file within the temp directory
    creates: "{{ temp_install_config_dir_info.path }}/bootstrap-in-place-for-live-iso.ign"
  delegate_to: localhost
  when: temp_install_config_dir_info.path is defined

- name: Read the metaday.json file that defines project variables
  ansible.builtin.include_tasks: tasks/read_metadata.yml
  vars:
    metadata_location: "{{ temp_install_config_dir_info.path }}"
  when: temp_install_config_dir_info.path is defined

- name: Set the new metadata_location variable
  ansible.builtin.set_fact:
    metadata_location: "{{ project_build_dir }}/{{ project_name }}"
  when: project_name is defined

- name: Copy temporary folder to a local project directory {{ temp_install_config_dir_info.path }} -> {{ metadata_location }} # noqa name[template]
  ansible.builtin.copy:
    src: "{{ temp_install_config_dir_info.path }}/"
    dest: "{{ metadata_location }}"
    remote_src: true
    mode: '0755'
  when: temp_install_config_dir_info.path is defined
  delegate_to: localhost

- name: Check if ISO exists in iso_download_dir
  ansible.builtin.stat:
    path: "{{ iso_download_dir }}/{{ sno_iso_image_name }}"
  register: iso_file_stat
  delegate_to: localhost

- name: Download ISO if it does not exist
  ansible.builtin.include_tasks: download_iso.yml
  when: not iso_file_stat.stat.exists

- name: Copy ISO from iso_download_dir to project directory
  ansible.builtin.copy:
    src: "{{ iso_download_dir }}/{{ sno_iso_image_name }}"
    dest: "{{ metadata_location }}/{{ project_iso_image }}"
    force: true
    mode: '0644' # Explicitly set file permissions
  when: temp_install_config_dir_info.path is defined
  delegate_to: localhost

- name: Find all Butane template files (.j2) in configs/openshift/machine-configs/butane
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../configs/openshift/machine-configs/butane"
    patterns: "*.j2"
  register: butane_template_files
  delegate_to: localhost

- name: Separate merge template from other templates
  ansible.builtin.set_fact:
    regular_templates: "{{ butane_template_files.files | rejectattr('path', 'match', '.*merge\\.bu\\.j2$') | list }}"
    merge_templates: "{{ butane_template_files.files | selectattr('path', 'match', '.*merge\\.bu\\.j2$') | list }}"
  delegate_to: localhost
  when: butane_template_files.files | length > 0

- name: Set empty template lists when no templates found
  ansible.builtin.set_fact:
    regular_templates: []
    merge_templates: []
  delegate_to: localhost
  when: butane_template_files.files | length == 0

- name: Process regular Butane templates first (excluding merge templates)
  ansible.builtin.template:
    src: "{{ template_file.path }}"
    dest: "{{ metadata_location }}/{{ template_file.path | basename | regex_replace('\\.j2$', '') }}"
    mode: '0644'
  loop: "{{ regular_templates | default([]) }}"
  loop_control:
    loop_var: template_file
  when:
    - temp_install_config_dir_info.path is defined
    - regular_templates is defined
    - regular_templates | length > 0
  delegate_to: localhost

- name: Find generated .bu files in project directory
  ansible.builtin.find:
    paths: "{{ metadata_location }}"
    patterns: "*.bu"
  register: generated_bu_files
  delegate_to: localhost
  when: temp_install_config_dir_info.path is defined

- name: Create list of .bu filenames for merge template
  ansible.builtin.set_fact:
    butane_files: "{{ generated_bu_files.files | map(attribute='path') | map('basename') | list }}"
  delegate_to: localhost
  when:
    - temp_install_config_dir_info.path is defined
    - generated_bu_files.files is defined
    - generated_bu_files.files | length > 0

- name: Set empty butane_files list when no .bu files found
  ansible.builtin.set_fact:
    butane_files: []
  delegate_to: localhost
  when:
    - temp_install_config_dir_info.path is defined
    - (generated_bu_files.files is not defined or generated_bu_files.files | length == 0)

- name: Process merge Butane templates with list of generated .bu files
  ansible.builtin.template:
    src: "{{ template_file.path }}"
    dest: "{{ metadata_location }}/{{ template_file.path | basename | regex_replace('\\.j2$', '') }}"
    mode: '0644'
  loop: "{{ merge_templates | default([]) }}"
  loop_control:
    loop_var: template_file
  when:
    - temp_install_config_dir_info.path is defined
    - merge_templates is defined
    - merge_templates | length > 0
  delegate_to: localhost

- name: Check if merge.bu file exists for final ignition generation
  ansible.builtin.stat:
    path: "{{ metadata_location }}/merge.bu"
  register: merge_bu_stat
  delegate_to: localhost
  when: temp_install_config_dir_info.path is defined

- name: Convert individual .bu files to .ign files first
  ansible.builtin.shell:
    cmd: >
      {{ butane_executable | default('butane') }} --pretty --strict --raw
      "{{ metadata_location }}/{{ bu_file }}"
      > "{{ metadata_location }}/{{ ign_file }}"
    creates: "{{ metadata_location }}/{{ ign_file }}"
  vars:
    ign_file: "{{ bu_file | regex_replace('\\.bu$', '.ign') }}"
  loop: "{{ butane_files | default([]) }}"
  loop_control:
    loop_var: bu_file
  register: butane_convert_result
  delegate_to: localhost
  when:
    - temp_install_config_dir_info.path is defined
    - butane_files is defined
    - butane_files | length > 0

- name: Check for butane conversion failures
  ansible.builtin.fail:
    msg: |
      Butane conversion failed for one or more files:
      {% for result in butane_convert_result.results | default([]) %}
      {% if result.rc is defined and result.rc != 0 %}
      - {{ result.bu_file }}: {{ result.stderr | default('Unknown error') }}
      {% endif %}
      {% endfor %}
  when:
    - temp_install_config_dir_info.path is defined
    - butane_convert_result is defined
    - butane_convert_result.results is defined
    - butane_convert_result.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0
  delegate_to: localhost

- name: Display .bu to .ign conversion results
  ansible.builtin.debug:
    msg: "✅ Successfully converted {{ item.bu_file }} to {{ item.bu_file | regex_replace('\\.bu$', '.ign') }}"
  loop: "{{ butane_convert_result.results | default([]) }}"
  when:
    - temp_install_config_dir_info.path is defined
    - item.rc is defined
    - item.rc == 0
  delegate_to: localhost

- name: Generate final ignition config from merge.bu using butane
  ansible.builtin.shell:
    cmd: >
      {{ butane_executable | default('butane') }} --pretty --strict --files-dir "{{ metadata_location }}"
      "{{ metadata_location }}/merge.bu"
      > "{{ metadata_location }}/sno-final-config.ign"
    creates: "{{ metadata_location }}/sno-final-config.ign"
  register: butane_final_result
  delegate_to: localhost
  when:
    - temp_install_config_dir_info.path is defined
    - merge_bu_stat.stat.exists | default(false)
  failed_when: butane_final_result.rc != 0

- name: Display final ignition config generation result
  ansible.builtin.debug:
    msg: "✅ Successfully generated sno-final-config.ign from merge.bu"
  when:
    - temp_install_config_dir_info.path is defined
    - merge_bu_stat.stat.exists | default(false)
    - butane_final_result is succeeded
  delegate_to: localhost

- name: Embed ignition config into ISO using coreos-installer (via Podman)
  ansible.builtin.shell:
    cmd: >
      podman run --privileged --pull newer --rm
      -v /dev:/dev -v /run/udev:/run/udev -v {{ project_build_dir }}/{{ project_name }}:/data
      -w /data quay.io/coreos/coreos-installer:release
      iso ignition embed -fi /data/sno-final-config.ign /data/{{ project_iso_image }}
  register: embed_result
  become: true
  changed_when: embed_result.rc != 0
  delegate_to: localhost
  when: temp_install_config_dir_info.path is defined # Only if temp dir exists

- name: Copy install-config.yaml to project directory
  ansible.builtin.copy:
    src: "{{ install_config }}"
    dest: "{{ metadata_location }}/install-config.yaml"
    mode: '0644'
  delegate_to: localhost

- name: Display the results
  ansible.builtin.debug:
    msg:
      - "Project name: {{ project_name }}"
      - "Project directory: {{ project_dir }}"
      - "{{ install_config }} file copied to project directory."
  when: project_name is defined and metadata_json_content.content is defined and (metadata_json_content.content | b64decode | from_json).infraID is defined
  delegate_to: localhost

- name: Output formatted OpenStack command to upload ISOa
  ansible.builtin.debug:
    msg: "{{ image_command | split('\n') }}"
  vars:
    image_command: |
      ----------------------------------------------------------------------
      OpenStack ISO Upload Command
      ----------------------------------------------------------------------
      To upload the ISO image to OpenStack manually, you can use a command similar to this:
      openstack image create --progress --disk-format iso --container-format bare --file {{ project_dir }}/{{ project_iso_image }} {{ project_iso_image }}
      Notes:
      - Ensure you are logged into your OpenStack environment (source your RC file).
      - The '--file' path should be accessible from where you run the command.

      Trying to upload the ISO image automatically...
      ----------------------------------------------------------------------

- name: Check if image already exists in OpenStack
  ansible.builtin.shell: |
    openstack image show "{{ project_iso_image }}" --format json
  register: existing_image_info
  failed_when: false
  changed_when: false

- name: Upload an image using OpenStack CLI from {{ metadata_location }}/{{ project_iso_image }} # noqa name[template]
  ansible.builtin.shell: |
    openstack image create \
      --progress \
      --disk-format iso \
      --container-format bare \
      --shared \
      --file "{{ metadata_location }}/{{ project_iso_image }}" \
      "{{ project_iso_image }}"
  register: image_upload_result
  retries: 3
  delay: 30
  until: image_upload_result.rc == 0
  failed_when: image_upload_result.rc != 0
  changed_when: image_upload_result.rc == 0
  when: existing_image_info.rc != 0

- name: Display image upload success message
  ansible.builtin.debug:
    msg: "Image '{{ project_iso_image }}' already exists, skipping upload."
  when: existing_image_info.rc == 0

- name: Display upload success message
  ansible.builtin.debug:
    msg: "✅ Image '{{ project_iso_image }}' uploaded successfully using OpenStack CLI."
  when:
    - existing_image_info.rc != 0
    - image_upload_result.rc == 0

- name: Display upload failure troubleshooting information
  ansible.builtin.debug:
    msg: "{{ image_command | split('\n') }}"
  vars:
    image_command: |
      ❌ Image upload failed after {{ image_upload_result.attempts | default(3) }} retries.

      Command that failed:
      openstack image create --progress --disk-format iso --container-format bare --public --file {{ metadata_location }}/{{ project_iso_image }} {{ project_iso_image }}

      Troubleshooting steps:
      1. Verify network connectivity to OpenStack API: curl -I $OS_AUTH_URL
      2. Check available storage quota: openstack quota show --usage
      3. Monitor upload progress: watch -n 5 "openstack image list | grep {{ project_iso_image }}"
      4. Check OpenStack credentials: openstack token issue
      5. Verify file exists and is readable: ls -la {{ metadata_location }}/{{ project_iso_image }}

      Error output:
      {{ image_upload_result.stderr | default('No error output available') }}

      For more details, see: docs/troubleshooting-image-upload.md
  when:
    - existing_image_info.rc != 0
    - image_upload_result.rc != 0
