---
# Configure networking for RHOSO services

- name: Create NMState instance
  kubernetes.core.k8s:
    definition:
      apiVersion: nmstate.io/v1
      kind: NMState
      metadata:
        name: nmstate
        namespace: openshift-nmstate
      spec: {}
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Wait for NMState to be ready (lenient check)
  kubernetes.core.k8s_info:
    api_version: nmstate.io/v1
    kind: NMState
    name: nmstate
    namespace: openshift-nmstate
    kubeconfig: "{{ kubeconfig_path }}"
  register: nmstate_instance
  until: nmstate_instance.resources | length > 0
  retries: 5
  delay: 10
  failed_when: false

- name: Display NMState status
  ansible.builtin.debug:
    msg:
      - "NMState instance found: {{ nmstate_instance.resources | length > 0 }}"
      - "NMState status: {{ nmstate_instance.resources[0].status | default('No status yet') if nmstate_instance.resources | length > 0 else 'Not found' }}"

