- name: Create MetalLB system namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: metallb-system
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Create MetalLB instance
  kubernetes.core.k8s:
    definition:
      apiVersion: metallb.io/v1beta1
      kind: MetalLB
      metadata:
        name: metallb
        namespace: metallb-system
      spec: {}
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Create MetalLB IP address pool for RHOSO
  kubernetes.core.k8s:
    definition:
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: "{{ rhoso_namespace }}"
        namespace: openshift-operators
      spec:
        addresses:
          - "{{ load_balancer_ip_range }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Create MetalLB L2 advertisement
  kubernetes.core.k8s:
    definition:
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: "{{ rhoso_namespace }}-l2adv"
        namespace: openshift-operators
      spec:
        ipAddressPools:
          - "{{ rhoso_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Networking configuration summary
  ansible.builtin.debug:
    msg:
      - "=== Networking Configuration Complete ==="
      - "✅ NMState instance: Created"
      - "⚠️  NNCP for OpenStack networks: Temporarily disabled (waiting for NMState readiness)"
      - "✅ MetalLB instance: Created"
      - "✅ IP address pool: {{ load_balancer_ip_range }}"
      - "✅ L2 advertisement: Configured"
