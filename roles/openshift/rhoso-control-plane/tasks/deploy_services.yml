---
# Deploy RHOSO control plane services

- name: Load passwords from secrets file if it exists
  ansible.builtin.include_vars: "{{ playbook_dir }}/../secrets/passwords.yaml"
  failed_when: false
  tags: secrets

- name: Create OpenStack secret for RHOSO services
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: osp-secret
        namespace: "{{ rhoso_namespace }}"
      type: Opaque
      data:
        # Base64 encoded OpenStack service passwords - loaded from secrets/passwords.yaml if available
        AdminPassword: "{{ (admin_password | default('admin123')) | b64encode }}"
        DatabasePassword: "{{ (database_password | default('database123')) | b64encode }}"
        RabbitPassword: "{{ (rabbit_password | default('rabbit123')) | b64encode }}"
        ServicePassword: "{{ (service_password | default('service123')) | b64encode }}"
        # Individual service passwords
        PlacementPassword: "{{ (placement_password | default('placement123')) | b64encode }}"
        KeystonePassword: "{{ (keystone_password | default('keystone123')) | b64encode }}"
        GlancePassword: "{{ (glance_password | default('glance123')) | b64encode }}"
        CinderPassword: "{{ (cinder_password | default('cinder123')) | b64encode }}"
        NeutronPassword: "{{ (neutron_password | default('neutron123')) | b64encode }}"
        NovaPassword: "{{ (nova_password | default('nova123')) | b64encode }}"
        HeatPassword: "{{ (heat_password | default('heat123')) | b64encode }}"
        HorizonPassword: "{{ (horizon_password | default('horizon123')) | b64encode }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Deploy OpenStack Control Plane
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'openstack-control-plane.yaml.j2') | from_yaml }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ rhoso_deployment_timeout }}"

- name: Wait for RHOSO services to be ready
  kubernetes.core.k8s_info:
    api_version: core.openstack.org/v1beta1
    kind: OpenStackControlPlane
    name: openstack
    namespace: "{{ rhoso_namespace }}"
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ rhoso_deployment_timeout }}"
  register: control_plane_status

- name: Display deployment status
  ansible.builtin.debug:
    msg:
      - "=== RHOSO Services Deployment Complete ==="
      - "✅ OpenStack Control Plane: {{ control_plane_status.resources[0].status.phase | default('Unknown') }}"
      - "✅ Services deployed and ready"
