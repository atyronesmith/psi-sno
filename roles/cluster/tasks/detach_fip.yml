---
# These tasks are intended to free/release floating IPs.
# The first task frees a specific, hardcoded IP.
# The second task frees an IP specified by the variable 'os_network_fip_to_free'.
# Ensure this variable is defined before running these tasks (e.g., in common_vars.yml, inventory, or a vars block).

# Example of where os_network_fip_to_free might be defined if this were a full playbook:
# vars:
#   os_network_fip_to_free: "YOUR_OS_FIP_ADDRESS_HERE" # e.g., "10.0.108.219"
#   # project_instance_ip, project_instance_ip_os, etc., from original context may not be directly used here
#   # but could be sources for determining the FIP addresses to free in a larger workflow.

- name: Free (release) floating IP 10.0.108.218 (formerly for SNO network interface)
  openstack.cloud.floating_ip:
    state: absent
    server: "{{ project_name }}" # Name of the server to which the FIP was attached
    network: "{{ project_provider_network }}" # External network from which the FIP was allocated
    floating_ip_address: "10.0.108.218" # Specific IP to release
    wait: true
    timeout: 120
  register: sno_fip_release_result
  # Consider adding 'ignore_errors: true' if you want the playbook to continue
  # even if this specific IP does not exist or cannot be released.

- name: Free (release) floating IP {{ os_network_fip_to_free }} (formerly for OS network interface) # noqa name[template]
  openstack.cloud.floating_ip:
    state: absent
    server: "{{ project_name }}" # Name of the server to which the FIP was attached
    network: "{{ project_provider_network }}" # External network from which the FIP was allocated
    floating_ip_address: "{{ os_network_fip_to_free }}" # Variable for the OS network FIP to release
                                                       # This variable MUST be defined.
    wait: true
    timeout: 180
  register: os_fip_release_result
  # Consider adding 'ignore_errors: true'

- name: Display Floating IP Release Status
  ansible.builtin.debug:
    msg:
      - "Release status for SNO FIP 10.0.108.218: "
      - "  {{ 'Released successfully' if sno_fip_release_result.changed else 'No change (already absent or not found)' }}"
      - "Release status for OS FIP {{ os_network_fip_to_free }}: "
      - "  {{ 'Released successfully' if os_fip_release_result.changed else 'No change (already absent or not found)' }}"
  # Note: 'changed' is true if the FIP was present and then deleted by the task.
  # If the FIP was already absent, 'changed' will be false.
  # If 'ignore_errors: true' was used on the tasks, also check 'sno_fip_release_result.failed'
  # and 'os_fip_release_result.failed' for a more complete status.
