[defaults]
inventory = inventory/environments/psi
roles_path = roles
host_key_checking = False
gathering = smart
fact_caching = memory
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600
stdout_callback = yaml
bin_ansible_callbacks = True
collections_path = ~/.ansible/collections
interpreter_python = auto_silent
timeout = 60
forks = 20
ansible_managed = Ansible managed: {file} modified on %Y-%m-%d %H:%M:%S by {uid} on {host}
retry_files_enabled = False
gathering_timeout = 30

[inventory]
enable_plugins = openstack.cloud.openstack

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3
pipelining = True
control_path_dir = ~/.ansible/cp
control_path = %(directory)s/%%h-%%p-%%r

[persistent_connection]
connect_timeout = 60
command_timeout = 60

[galaxy]
server_list = automation_hub, galaxy

[galaxy_server.automation_hub]
url = https://console.redhat.com/api/automation-hub/content/published/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token

[galaxy_server.galaxy]
url = https://galaxy.ansible.com/
