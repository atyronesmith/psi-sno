---
# Playbook to configure CoreDNS settings for multiple clusters defined in 'clusters.yml'.
# It groups clusters by their domain and then applies configurations using 'add_cluster_tasks.yml'.
- name: Setup CoreDNS on Fedora based on cluster definitions
  hosts: all       # Target all hosts defined in the inventory; ensure these are your Fedora servers.
  become: true     # Execute tasks with superuser (sudo) privileges.
  remote_user: fedora # Specify the remote user for SSH connections.
  vars_files:
    - ../common_vars.yml # Load common variables from an external file (if needed).

  tasks:
    - name: Check if clusters.yml file exists # noqa run-once[task]
      ansible.builtin.stat:
        path: "./clusters.yml" # Check in the current directory relative to the playbook
      register: clusters_file_stat
      # This task runs on the Ansible control node because it's checking a local file
      # before it would be used by include_vars.
      # If clusters.yml is meant to be on the remote hosts, the path and delegation would change.
      delegate_to: localhost
      run_once: true # Ensure this check runs only once, not per host

    - name: Fail if clusters.yml does not exist # noqa run-once[task]
      ansible.builtin.fail:
        msg: "CRITICAL: The 'clusters.yml' file was not found in the current directory. This file is required to proceed."
      when: not clusters_file_stat.stat.exists
      run_once: true # Ensure this check runs only once
      delegate_to: localhost # Ensure this task runs on the control node

    - name: Load cluster definitions from external file
      ansible.builtin.include_vars:
        file: clusters.yml # Expects 'clusters.yml' in the same directory or roles/playbook vars path.
                           # This file should contain a dictionary named 'clusters'.
      # This task will only run if the previous 'fail' task did not trigger.

    - name: Reorganize cluster data into a dictionary grouped by domain
      ansible.builtin.set_fact:
        cluster_dict: >- # Using >- for a block scalar, preserving newlines but stripping the final one.
          {{
            cluster_dict | default({}) |
            combine(
              {item.value.domain: [ item ]},
              recursive=true,
              list_merge='append_rp'
            )
          }}
      loop: "{{ clusters | dict2items }}" # Iterate over the 'clusters' dictionary loaded from 'clusters.yml'.
                                         # dict2items converts {'key1': 'val1', 'key2': 'val2'}
                                         # to [{key: 'key1', value: 'val1'}, {key: 'key2', value: 'val2'}].
      loop_control:
        label: "Processing cluster: {{ item.key }}" # Provides clearer logging for each item in the loop.
      # This task effectively transforms a flat list of clusters into a dictionary where each key
      # is a unique domain, and its value is a list of all cluster items belonging to that domain.
      # Example input 'clusters':
      #   cluster_a: { domain: "example.com", ... }
      #   cluster_b: { domain: "example.org", ... }
      #   cluster_c: { domain: "example.com", ... }
      # Example output 'cluster_dict':
      #   "example.com": [ {key: cluster_a, value: {...}}, {key: cluster_c, value: {...}} ]
      #   "example.org": [ {key: cluster_b, value: {...}} ]

    # The following task is for debugging purposes.
    # It can be enabled by uncommenting if you need to inspect the 'cluster_dict' structure.
    # - name: DEBUG | Display the reorganized cluster dictionary
    #   ansible.builtin.debug:
    #     var: item # Displays each domain and its associated list of cluster items.
    #   loop: "{{ cluster_dict | dict2items }}"
    #   loop_control:
    #     label: "Domain: {{ item.key }}"

    - name: Apply CoreDNS configuration tasks for each domain group
      ansible.builtin.include_tasks: add_cluster_tasks.yml # Includes tasks from another file for modularity.
      vars:
        cluster_domain: "{{ item.key }}"   # The current domain being processed (e.g., "example.com").
        cluster_list: "{{ item.value }}" # The list of all cluster configurations associated with this domain.
      loop: "{{ cluster_dict | dict2items }}" # Iterate over the 'cluster_dict' (domains and their cluster lists).
      loop_control:
        label: "Configuring domain: {{ item.key }}" # Clearer logging for each domain being configured.
      # 'add_cluster_tasks.yml' will receive 'cluster_domain' and 'cluster_list'
      # and should contain the logic to setup CoreDNS for that specific domain
      # using the provided list of cluster details.

    - name: Create dnsmasq config files on localhost for each cluster domain # noqa run-once[task]
      ansible.builtin.copy:
        dest: "/etc/NetworkManager/dnsmasq.d/99-{{ item.key }}.conf"
        content: "server=/{{ item.key }}/{{ dns_fip }}" # As per user request for content
        owner: root
        group: root
        mode: '0644'
      loop: "{{ cluster_dict | dict2items }}" # Loop through domains found in cluster_dict
      loop_control:
        label: "Creating localhost DNS for domain: {{ item.key }}"
      delegate_to: localhost # Perform this task on the Ansible control node
      run_once: true # Crucial: ensures this whole loop task runs once using cluster_dict from the first host.

    - name: Restart coredns to apply dnsmasq changes # noqa run-once[task]
      ansible.builtin.systemd:
        name: coredns
        state: restarted

    - name: Restart NetworkManager to apply dnsmasq changes # noqa run-once[task]
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted
