---
- name: Install CoreDNS on Fedora
  hosts: localhost
  gather_facts: false
  vars:
    keyname: "nextgen"
    image_name: "Fedora-Cloud-Base-42-latest"
    image_url: "https://download.fedoraproject.org/pub/fedora/linux/releases/42/Cloud/x86_64/images/Fedora-Cloud-Base-42-latest.x86_64.qcow2"

  tasks:
    - name: Create key pair from local user
      openstack.cloud.keypair:
        cloud: psi
        name: "{{ keyname }}"
        public_key_file: /home/nextgen/.ssh/id_rsa.pub
        state: present

    - name: Create NFV DNS server security group
      openstack.cloud.security_group:
        name: nfv-sno-dns-sg
        state: present
        cloud: psi
        description: Security group for the NFV DNS server
        security_group_rules:
          - protocol: tcp
            port_range_min: 53
            port_range_max: 53
            remote_ip_prefix: 0.0.0.0/0
          - protocol: udp
            port_range_min: 53
            port_range_max: 53
            remote_ip_prefix: 0.0.0.0/0
          - protocol: tcp
            port_range_min: 22
            port_range_max: 22
            remote_ip_prefix: 0.0.0.0/0
          - protocol: icmp
            port_range_min: -1
            port_range_max: -1
            remote_ip_prefix: 0.0.0.0/0

    - name: Get subnet ID for nfv-sno
      openstack.cloud.subnets_info:
        cloud: psi
        name: nfv-sno
      register: nfv_sno_info

    - name: Create Port for the DNS server
      openstack.cloud.port:
        name: nfv-dns-port
        state: present
        cloud: psi
        network: nfv-sno
        security_groups:
          - nfv-sno-dns-sg
          - default
        fixed_ips:
          - ip_address: 11.0.0.10
            subnet_id: "{{ nfv_sno_info.subnets[0].id }}"

    - name: Check if the image already exists
      openstack.cloud.image_info:
        cloud: psi
        name: "{{ image_name }}"
      register: image_info

    - name: Check/Install image
      when: image_info.images | length == 0
      block:
        - name: Download the Fedora-Cloud-Base image
          ansible.builtin.get_url:
            url: "{{ image_url }}"
            dest: /tmp
            mode: "0644"
            force: false

        - name: Create the Fedora-Cloud-Base image
          openstack.cloud.image:
            cloud: psi
            name: "{{ image_name }}"
            state: present
            disk_format: qcow2
            container_format: bare
            filename: "/tmp/{{ image_name }}"
            tags:
              - nfv-sno

    - name: Create the NFV DNS server in the nfv PSI project
      openstack.cloud.server:
        name: nfv-dns
        auto_ip: false
        state: present
        cloud: psi
        image: "{{ image_name }}"
        flavor: PnTAE.CPU_2_Memory_4096_Disk_10
        boot_from_volume: true
        volume_size: 10
        key_name: "{{ keyname }}"
        nics:
          - port-name: nfv-dns-port

    - name: Create/attach floating IP to the NFV DNS server
      openstack.cloud.floating_ip:
        cloud: psi
        state: present
        reuse: true
        server: nfv-dns
        network: provider_net_shared_3
        nat_destination: nfv-sno
        fixed_address: 11.0.0.10
        wait: true
        timeout: 180

    - name: Get the floating IP address of the NFV DNS server
      openstack.cloud.server_info:
        cloud: psi
        name: nfv-dns
      register: nfv_dns_info

    - name: Print the floating IP address of the NFV DNS server
      ansible.builtin.debug:
        msg: "The floating IP address of the NFV DNS server is {{ nfv_dns_info.servers[0].access_ipv4 }}"
