  # Core infrastructure passwords
  AdminPassword: YWRtaW4xMjM=        # "admin123" - OpenStack admin user
  DatabasePassword: ZGF0YWJhc2UxMjM=  # "database123" - MariaDB/Galera
  RabbitPassword: cmFiYml0MTIz        # "rabbit123" - RabbitMQ messaging
  ServicePassword: c2VydmljZTEyMw==   # "service123" - Default service password

  # Individual OpenStack service passwords
  PlacementPassword: cGxhY2VtZW50MTIz  # "placement123" - Placement API service
  KeystonePassword: a2V5c3RvbmUxMjM=   # "keystone123" - Identity service
  GlancePassword: Z2xhbmNlMTIz        # "glance123" - Image service
  CinderPassword: Y2luZGVyMTIz        # "cinder123" - Block storage service
  NeutronPassword: bmV1dHJvbjEyMw==    # "neutron123" - Networking service
  NovaPassword: bm92YTEyMw==          # "nova123" - Compute service
  HeatPassword: aGVhdDEyMw==          # "heat123" - Orchestration service
  HorizonPassword: aG9yaXpvbjEyMw==    # "horizon123" - Dashboard service
